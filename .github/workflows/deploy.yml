# build + deploy ขึ้น GitHub Pages อัตโนมัติทุกครั้งที่ push ขึ้น main
# ไม่ต้องรันคำสั่ง deploy เองอีก และไม่มีระบบเครดิตมาบล็อกแบบ Netlify
#
# เสิร์ฟ **รุ่นที่ขายอย่างเดียว** ที่ราก — ทดลอง 30 วัน แล้วล็อกฟีเจอร์สมองโค้ช
#
# เดิมมีรุ่นส่วนตัวซ่อนอยู่ที่ /me/ ด้วย เอาออกแล้วเมื่อ 15 ส.ค. 2026 ตามที่ผู้ใช้สั่ง
# (รุ่นส่วนตัวย้ายไป rankforge-me.pages.dev เรียบร้อยแล้ว — ดู deploy-personal.yml)
# เหตุผลที่ต้องเอาออก: /me/ เป็น path ที่เดาไม่ยาก ใครรู้ก็ได้รุ่นปลดล็อกฟรี
# ตอนนี้เริ่มขายจริงแล้ว เว็บที่ขายจึงไม่ควรมีรุ่นปลดล็อกซ่อนอยู่ใต้
#
# ครั้งแรกต้องไปเปิดที่ repo -> Settings -> Pages -> Source = "GitHub Actions" ก่อน
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

permissions:
  contents: read
  pages: write
  id-token: write

# ถ้า push ซ้อนกันหลายรอบ ให้รอรอบก่อนจบก่อน (กัน deploy ชนกัน)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:pro

      # กันพลาดแบบที่เสียหายที่สุดสำหรับเว็บที่ขาย: ถ้าไฟล์ที่ build ไม่มีโค้ดตรวจสิทธิ์
      # แปลว่าได้รุ่นส่วนตัวมา = แจกของที่ขายฟรีให้ทุกคนที่เข้าเว็บ
      - name: ยืนยันว่าเป็นรุ่นที่ขายจริง
        run: |
          if ! grep -rq "artyz-coach-2026" dist-pro/assets/*.js; then
            echo "::error::dist-pro ไม่มีโค้ดตรวจสิทธิ์ — build ผิดรุ่น ไม่ deploy"
            exit 1
          fi

      - name: เตรียมโฟลเดอร์ที่จะขึ้น
        run: |
          mkdir -p site
          cp -r dist-pro/* site/
          # GitHub Pages ไม่มี redirect rule แบบ netlify.toml — ให้ 404 เสิร์ฟหน้าเดียวกับ index
          cp site/index.html site/404.html

      # หน้าเปลี่ยนทางที่ /me/ สำหรับไอคอนเก่าบนหน้าจอโฮมที่ยังชี้มาที่นี่
      #
      # ใช้ 404.html แทนไม่ได้ ถึงจะถูกเสิร์ฟจริงก็เถอะ: base เป็น "./" ทุก asset
      # จึงเป็น relative พอหน้าเดียวกันถูกเสิร์ฟที่ /me/ มันไปหา /me/assets/... ซึ่งไม่มี
      # = ได้หน้าขาวเปล่า ต้องเป็นไฟล์ที่ไม่พึ่ง asset อะไรเลยแบบนี้เท่านั้น
      #
      # ไม่ได้เอารุ่นส่วนตัวกลับมา — แค่พาไปแอปรุ่นขายที่ราก ซึ่งเป็น origin เดียวกัน
      # localStorage จึงเป็นกองเดิม ประวัติที่ค้างอยู่ยังเปิดอ่านและกดสร้างโค้ดย้ายได้
      - name: วางหน้าเปลี่ยนทางที่ /me/
        run: |
          mkdir -p site/me
          cat > site/me/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>RANKFORGE</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0;url=../">
          <style>body{background:#04070D;color:#8FA3BF;font:14px/1.6 system-ui,sans-serif;
          display:grid;place-items:center;height:100vh;margin:0;text-align:center;padding:1rem}
          a{color:#5BC8F5}</style>
          <p>RANKFORGE ย้ายไปที่ <a href="../">artyzis.github.io/gym-tracker/</a> แล้ว<br>
          กำลังพาไป… ข้อมูลการฝึกของคุณยังอยู่ครบ</p>
          <script>location.replace("../")</script>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
