# build + deploy รุ่นที่ขาย (pro) ขึ้น GitHub Pages อัตโนมัติทุกครั้งที่ push ขึ้น main
# ไม่ต้องรันคำสั่ง deploy เองอีก และไม่มีระบบเครดิตมาบล็อกแบบ Netlify
#
# ครั้งแรกต้องไปเปิดที่ repo -> Settings -> Pages -> Source = "GitHub Actions" ก่อน
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

permissions:
  contents: read
  pages: write
  id-token: write

# ถ้า push ซ้อนกันหลายรอบ ให้รอรอบก่อนจบก่อน (กัน deploy ชนกัน)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # รุ่น pro เท่านั้นที่ขึ้นเว็บสาธารณะ — รุ่น personal (ปลดล็อกหมด) ห้ามขึ้นที่นี่
      - run: npm run build:pro

      # GitHub Pages ไม่มี redirect rule แบบ netlify.toml — ให้ 404 เสิร์ฟหน้าเดียวกับ index
      # กันจอ 404 ถ้าใครเปิด path แปลกๆ (แอปไม่มี router อยู่แล้ว แต่กันไว้)
      - run: cp dist-pro/index.html dist-pro/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pro

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
