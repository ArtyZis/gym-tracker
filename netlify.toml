[build]
  publish = "dist"
  # ระบุชัดเจน: โปรเจกต์มีทั้ง Vite (PWA) และ Parcel (bundle.html ไฟล์เดียว)
  # ถ้าไม่บอก Netlify จะถามว่าจะใช้ตัวไหน แล้วพังตอน deploy แบบไม่มี stdin
  command = "npm run build"

# SPA: ทุก path ตกมาที่ index.html (แอปไม่มี router แต่กัน 404 ตอนเปิดจากไอคอนโฮมสกรีน)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# service worker ห้าม cache ที่ CDN ไม่งั้นอัปเดตเวอร์ชันใหม่แล้วเครื่องผู้ใช้ไม่รู้
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# ไฟล์ hashed ของ Vite เปลี่ยนชื่อทุก build อยู่แล้ว cache ยาวได้
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ความปลอดภัยระดับ header — ใช้ได้เฉพาะบน Netlify (GitHub Pages ตั้ง header เองไม่ได้)
[[headers]]
  for = "/*"
  [headers.values]
    # frame-ancestors + X-Frame-Options: กันเว็บอื่นเอาแอปเราไปฝัง iframe หลอกคลิก (clickjacking)
    X-Frame-Options = "DENY"
    # กันเบราว์เซอร์เดาชนิดไฟล์เอง (MIME sniffing) ซึ่งเปิดช่องรันไฟล์ปลอมเป็นสคริปต์
    X-Content-Type-Options = "nosniff"
    # ไม่ส่ง URL เต็มของเราไปเว็บอื่นตอนผู้ใช้กดลิงก์ออก
    Referrer-Policy = "strict-origin-when-cross-origin"
    # ปิดสิทธิ์ที่แอปไม่ใช้ ไม่ให้สคริปต์แปลกปลอมเรียกได้
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    # CSP: หัวใจกัน XSS — script โหลดได้จากตัวเองเท่านั้น (ไม่มี inline/eval/CDN นอก)
    # ถ้าวันหนึ่งมี XSS หลุดเข้ามา สคริปต์ของแฮกเกอร์จะรันไม่ได้และดึงข้อมูลออกนอกไม่ได้
    # style ต้องเปิด unsafe-inline เพราะ React ใช้ inline style ทั้งแอป (script ยังล็อกแน่น)
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'"
